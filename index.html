/* Entrance: logo pops in, then shrinks away while a circle opens onto the town */
@property --hole{syntax:'<length>';inherits:false;initial-value:0px}
#intro{position:fixed;inset:0;z-index:1000;background:#f8efed;display:grid;place-items:center;pointer-events:auto;cursor:pointer;
 --cx:50vw;--cy:50vh;-webkit-mask:radial-gradient(circle at var(--cx) var(--cy),transparent var(--hole),#000 calc(var(--hole) + 1px));mask:radial-gradient(circle at var(--cx) var(--cy),transparent var(--hole),#000 calc(var(--hole) + 1px));
}
#intro.go{animation:introOpen 1.4s cubic-bezier(.45,0,.2,1) 1.75s forwards}
#intro img{position:absolute;left:var(--cx);top:var(--cy);width:min(62vmin,420px);height:auto;translate:-50% -50%;border-radius:50%;filter:drop-shadow(0 10px 24px rgba(74,31,8,.18));opacity:0}
#intro.go img{animation:introPop .8s cubic-bezier(.2,1.4,.4,1) both,introShrink 1s cubic-bezier(.6,0,.4,1) 1.6s forwards}
@keyframes introPop{from{opacity:0;scale:.55}to{opacity:1;scale:1}}

@keyframes introOpen{to{--hole:var(--holeMax,110vmax)}}
#intro.done{display:none}
@media (prefers-reduced-motion:reduce){#intro.go{animation:introFade .4s ease .8s forwards}#intro.go img{animation:none;opacity:1}@keyframes introFade{to{opacity:0}}}

<script>
(()=>{const t=document.getElementById('settingsTab'),p=document.getElementById('settingsPanel'),x=document.getElementById('settingsClose');
 const set=on=>{p.hidden=!on;t.setAttribute('aria-expanded',String(on));(on?x:t).focus({preventScroll:true});};
 t.onclick=()=>set(p.hidden);x.onclick=()=>set(false);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!p.hidden&&p.contains(document.activeElement)){e.stopImmediatePropagation();set(false);}},true);})();
</script>
<script>
// Entrance animation: centre it on the town, then remove it when finished (click to skip).
(()=>{const intro=document.getElementById('intro');if(!intro)return;
 const f=document.getElementById('frame');
 const place=()=>{if(!f)return;const r=f.getBoundingClientRect();intro.style.setProperty('--cx',(r.left+r.width/2)+'px');const cx=r.left+r.width/2,cy=Math.min(innerHeight/2,r.top+r.height/2);intro.style.setProperty('--cy',cy+'px');intro.style.setProperty('--holeMax',Math.ceil(Math.hypot(Math.max(cx,innerWidth-cx),Math.max(cy,innerHeight-cy)))+4+'px');};
 place();
 const img=intro.querySelector('img');let started=false;const go=()=>{if(started)return;started=true;place();intro.classList.add('go');};
 if(img.complete&&img.naturalWidth)go();else{img.addEventListener('load',go);img.addEventListener('error',go);setTimeout(go,1500);}
 const end=()=>{intro.classList.add('done');};
 intro.addEventListener('animationend',e=>{if(e.animationName==='introOpen'||e.animationName==='introFade')end();});
 intro.addEventListener('click',end);
 setTimeout(end,6000);
})();
</script>
