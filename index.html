<style>
*{box-sizing:border-box}body{margin:0;background:#142623;color:#fff4d0;font-family:Georgia,serif}
#shell{max-width:1380px;margin:18px auto;padding:0 14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:31px;color:#ffe9a9;text-shadow:2px 3px #5b3d29}.pill{background:#2d4a3f;border:2px solid #a79f70;border-radius:8px;padding:7px 12px}

.fieldRow{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}.dashCard button,.stationFrame button{cursor:pointer}.stationFrame button{font:700 14px Georgia,serif;padding:9px 13px;background:#e7c687;color:#3c3022;border:3px solid #89603a;box-shadow:2px 3px 0 #4c3424}.stationFrame button:hover{background:#fff0b4}.stationFrame button:focus-visible{outline:3px solid #4f9e97;outline-offset:3px}.stationFrame button.danger{background:#ad6352;color:#fff2df}.stationFrame button.secondary{background:#d5d9b6}

select{font:15px Georgia,serif;background:#f5dfb6;color:#3d3024;border:2px solid #a77a47;border-radius:5px;padding:9px;max-width:100%}.control{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.routineInfo{display:flex;flex-direction:column;gap:5px;flex:1;min-width:220px}.routineInfo strong{color:#ffe4a5;font-size:20px}.routineInfo span{font-size:15px}.timePanel,.bannerPanel{margin-top:18px;border:2px solid #9e8654;border-radius:9px;background:#243f34;padding:16px}.timeHeading{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.timeHeading>label:first-child{font-size:19px;font-weight:bold}#timeReadout{font-size:27px;color:#ffe5a4;min-width:130px}#timeSlider{width:100%;margin:20px 0 5px;accent-color:#e9c46b;height:24px;cursor:ew-resize}.ticks{display:flex;justify-content:space-between;color:#c8d5bc;font-size:12px}.jumpTimes{display:flex;flex-wrap:wrap;gap:6px;margin-top:17px}.jumpTimes button{font-size:12px;padding:8px}.quiet{font-size:13px;color:#c8d5bc;margin:13px 0 0}.bannerPanel{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.fileButton{display:flex;flex-direction:column;gap:7px;font-size:13px}#bannerMessage{font-size:13px;color:#d5dcbd;flex-basis:100%}canvas{cursor:pointer}#tip{max-width:85%}#frame{margin-bottom:6px}@media(max-width:600px){.bannerPanel,.timePanel{padding:12px}.timeHeading{gap:8px}.jumpTimes button{flex:1}.top h1{font-size:23px}#timeReadout{font-size:23px}.ticks{font-size:10px}}
 .clockMode{font-size:12px;color:#d6edc1;background:#31563e;border:1px solid #88a77a;border-radius:14px;padding:5px 9px}#currentTime{background:#b7d5a0}#speedSelect:disabled{opacity:.55}#timeReadout{min-width:160px}
.dashGrid.kpiGrid{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:800px){.dashGrid.kpiGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.dashGrid.kpiGrid{grid-template-columns:minmax(0,1fr)}}.eventList li span:last-child{white-space:nowrap}.dashGrid.kpi2{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:550px){.dashGrid.kpi2{grid-template-columns:minmax(0,1fr)}}
.catBar{margin-bottom:14px}.catSearch{flex:1;min-width:180px;padding:10px;background:#fff7e5;border:2px solid #9a815e;border-radius:2px;color:#382f25;font:15px Georgia,serif}.catCount{color:#d6c69e}
.catGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.stationFrame button.catCard{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px;text-align:left;background:#f1deb8;color:#3b3227;border:4px solid #9a7653;box-shadow:4px 5px 0 #182f29;font:14px Georgia,serif}
.stationFrame button.catCard:hover{background:#fff3d6;transform:translateY(-2px)}
.catPhoto{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#e3cfa6;border:2px solid #c2a17a}.noPhoto{display:flex;align-items:center;justify-content:center;font-size:40px;background:#e3cfa6;border:2px solid #c2a17a}
.catName{font-weight:bold;font-size:15px;line-height:1.25}.catPrice{color:#326556}.catTag{font-size:11px;color:#7a4a8a;font-weight:bold}
.catDetail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}.catBig{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border:4px solid #9a7653;box-shadow:4px 5px 0 #182f29;background:#e3cfa6}.catBig.noPhoto{font-size:70px}
.catPriceBig{font-size:22px;color:#326556}.catLink{display:inline-block;font:700 14px Georgia,serif;padding:9px 13px;background:#91b88a;color:#22301f;border:3px solid #397255;text-decoration:none}
.catFoot{margin-top:16px;color:#d6c69e}.catFoot a{color:#ffe29a}.stationFrame button.linkBtn,.linkBtn{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;color:#ffe29a;font:inherit;text-decoration:underline;cursor:pointer}
@media(max-width:650px){.catDetail{grid-template-columns:1fr}}
.lockWrap{display:flex;justify-content:center;padding:30px 0}.lockBox{width:min(360px,100%);text-align:center;display:flex;flex-direction:column;gap:10px}.lockIcon{font-size:40px}.lockBox h3{margin:0}
.lockBox input[type=password]{padding:11px;background:#fff7e5;border:2px solid #9a815e;border-radius:2px;color:#382f25;font:16px Georgia,serif;text-align:center}
.lockRemember{font-size:13px;color:#5c4832;display:flex;gap:6px;align-items:center;justify-content:center}.lockMsg{min-height:18px;margin:0;color:#a33f2c;font-weight:bold;font-size:14px}
.shake{animation:shake .35s}@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#tip{display:none!important}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.logo{width:58px;height:58px;border-radius:50%;box-shadow:0 0 0 3px #a47849,0 4px 0 #634329;background:#f7ece9}
.settingsTab{font:bold 14px Georgia,serif;padding:7px 12px}.settingsTab[aria-expanded="true"]{background:#ffdfa4;box-shadow:inset 0 2px 0 #c49a5c}
.settingsPanel{margin-top:12px;border:3px solid #a47849;border-radius:8px;background:#1d3a30;padding:6px 14px 14px;box-shadow:0 6px 0 #634329}.settingsPanel #actions{margin-top:10px}

<div id="shell">
