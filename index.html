:root{--pp-night:#16200f;--frame-out:#4a1f08;--frame:#b4561e;--frame-hi:#f0a64a;--frame-lo:#7a3410;--parchment:#fbe1a8;--parchment-2:#f2c983;--card:#fff1cf;--ink:#3b1e08;--ink-soft:#7a4a22;--gold:#ffd15c;--good:#3f8a2f;--warn:#d07a16;--bad:#b5452f;--font-display:"Pixelify Sans","Courier New",monospace;--font-body:"VT323","Courier New",monospace}
.bevel{background:var(--parchment);color:var(--ink);border:3px solid var(--frame-out);box-shadow:inset 0 0 0 3px var(--frame-hi),inset 0 0 0 6px var(--frame),inset 0 0 0 8px var(--frame-lo),inset 0 0 0 10px var(--frame-out),4px 5px 0 rgba(0,0,0,.4)}
.top h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);margin:0;letter-spacing:.02em;color:var(--gold);text-shadow:3px 0 0 var(--frame-out),-3px 0 0 var(--frame-out),0 3px 0 var(--frame-out),0 -3px 0 var(--frame-out),4px 5px 0 #000}
.pill{font-family:var(--font-display);font-size:15px;background:var(--parchment);color:var(--ink);border:3px solid var(--frame-out);border-radius:0;box-shadow:inset 0 0 0 2px var(--frame-hi),3px 4px 0 rgba(0,0,0,.4);padding:8px 12px}

.gearbtn[aria-expanded="true"]{background:var(--frame);color:#fff7e2}.gearbtn[aria-expanded="true"] svg{transform:rotate(90deg)}
.gearbtn:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}

.pp input[type=range]:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}
.pp .timeLbl{font-family:var(--font-display);font-size:24px;font-weight:700;min-width:100px;color:var(--ink);font-variant-numeric:tabular-nums}

/* Entrance: logo pops in, then shrinks away while a circle opens onto the town */
@property --hole{syntax:'<length>';inherits:false;initial-value:0px}
#intro{position:fixed;inset:0;z-index:1000;background:#f8efed;display:grid;place-items:center;pointer-events:auto;cursor:pointer;
 --cx:50vw;--cy:50vh;-webkit-mask:radial-gradient(circle at var(--cx) var(--cy),transparent var(--hole),#000 calc(var(--hole) + 1px));mask:radial-gradient(circle at var(--cx) var(--cy),transparent var(--hole),#000 calc(var(--hole) + 1px));
}
#intro.go{animation:introOpen 1.4s cubic-bezier(.45,0,.2,1) 1.75s forwards}
#intro img{position:absolute;left:var(--cx);top:var(--cy);width:min(62vmin,420px);height:auto;translate:-50% -50%;border-radius:50%;filter:drop-shadow(0 10px 24px rgba(74,31,8,.18));opacity:0}

<div id="intro" aria-hidden="true"><img src="assets/logo-large.png" alt=""></div>
<div id="shell">
  <div class="top">
    <div class="hud"><div class="pill" id="status">🌤️ Spring • Day 3 • Honey Meadows</div><button class="gearbtn bevel" id="settingsTab" aria-expanded="false" aria-controls="settingsPanel" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M19.07 9.81 L22.05 10.27 L22.05 13.73 L19.07 14.19 L18.55 15.45 L20.33 17.89 L17.89 20.33 L15.45 18.55 L14.19 19.07 L13.73 22.05 L10.27 22.05 L9.81 19.07 L8.55 18.55 L6.11 20.33 L3.67 17.89 L5.45 15.45 L4.93 14.19 L1.95 13.73 L1.95 10.27 L4.93 9.81 L5.45 8.55 L3.67 6.11 L6.11 3.67 L8.55 5.45 L9.81 4.93 L10.27 1.95 L13.73 1.95 L14.19 4.93 L15.45 5.45 L17.89 3.67 L20.33 6.11 L18.55 8.55 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button></div>
  </div>

      <div class="seg jumpTimes"><button class="segbtn" data-time="480">Breakfast</button><button class="segbtn" data-time="603">Commute</button><button class="segbtn" data-time="720">Work</button><button class="segbtn" data-time="1083">Home</button><button class="segbtn" data-time="1140">Dinner</button><button class="segbtn" data-time="1260">Couch</button><button class="segbtn" data-time="1380">Sleep</button></div>

<script>
(()=>{const t=document.getElementById('settingsTab'),p=document.getElementById('settingsPanel'),x=document.getElementById('settingsClose');
 const set=on=>{p.hidden=!on;t.setAttribute('aria-expanded',String(on));(on?x:t).focus({preventScroll:true});};
 t.onclick=()=>set(p.hidden);x.onclick=()=>set(false);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!p.hidden&&p.contains(document.activeElement)){e.stopImmediatePropagation();set(false);}},true);})();
</script>
<script>
// Entrance animation: centre it on the town, then remove it when finished (click to skip).
(()=>{const intro=document.getElementById('intro');if(!intro)return;
 const f=document.getElementById('frame');
 const place=()=>{if(!f)return;const r=f.getBoundingClientRect();intro.style.setProperty('--cx',(r.left+r.width/2)+'px');const cx=r.left+r.width/2,cy=Math.min(innerHeight/2,r.top+r.height/2);intro.style.setProperty('--cy',cy+'px');intro.style.setProperty('--holeMax',Math.ceil(Math.hypot(Math.max(cx,innerWidth-cx),Math.max(cy,innerHeight-cy)))+4+'px');};
 place();
 const img=intro.querySelector('img');let started=false;const go=()=>{if(started)return;started=true;place();intro.classList.add('go');};
 if(img.complete&&img.naturalWidth)go();else{img.addEventListener('load',go);img.addEventListener('error',go);setTimeout(go,1500);}
 const end=()=>{intro.classList.add('done');};
 intro.addEventListener('animationend',e=>{if(e.animationName==='introOpen'||e.animationName==='introFade')end();});
 intro.addEventListener('click',end);
 setTimeout(end,6000);
})();
</script>
